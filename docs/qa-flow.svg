<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1420" viewBox="0 0 1100 1420" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    .box { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.6; rx: 10; }
    .end { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.6; }
    .side { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.6; }
    .fallback { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.6; }
    .diamond { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.6; }
    .t { font-size: 15px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
    .s { font-size: 11.5px; fill: #64748b; text-anchor: middle; }
    .lbl { font-size: 13px; font-weight: 700; fill: #b45309; text-anchor: middle; }
    .note { font-size: 11.5px; fill: #64748b; }
    .edge { stroke: #475569; stroke-width: 1.6; fill: none; }
  </style>

  <rect x="0" y="0" width="1100" height="1420" fill="#ffffff"/>
  <text x="550" y="40" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">Distributor-RAG 问答流程（POST /api/chat/stream）</text>
  <text x="550" y="64" font-size="12.5" fill="#64748b" text-anchor="middle">前端 ChatPage → FastAPI → ChatService：查询规划 → 检索 → 证据门控 → 生成 → 校验 → 存储/推送</text>

  <!-- N1 前端 -->
  <rect class="end" x="220" y="88" width="320" height="56" rx="10"/>
  <text class="t" x="380" y="112">前端：用户输入问题</text>
  <text class="s" x="380" y="132">frontend/src/pages/ChatPage.tsx</text>
  <line class="edge" x1="380" y1="144" x2="380" y2="172" marker-end="url(#arrow)"/>

  <!-- N2 路由 -->
  <rect class="box" x="190" y="176" width="380" height="56" rx="10"/>
  <text class="t" x="380" y="200">POST /api/chat/stream（SSE 流式）</text>
  <text class="s" x="380" y="220">backend/app/routers/chat.py（另有非流式 /api/chat）</text>
  <line class="edge" x1="380" y1="232" x2="380" y2="260" marker-end="url(#arrow)"/>

  <!-- N3 会话与上下文 -->
  <rect class="box" x="180" y="264" width="400" height="72" rx="10"/>
  <text class="t" x="380" y="290">ChatService.ask_stream</text>
  <text class="s" x="380" y="310">读取/创建会话 · 历史消息 → 对话上下文（滑动窗口）</text>
  <text class="s" x="380" y="326">保存用户消息</text>
  <line class="edge" x1="380" y1="336" x2="380" y2="364" marker-end="url(#arrow)"/>

  <!-- N4 查询规划 -->
  <rect class="box" x="180" y="368" width="400" height="72" rx="10"/>
  <text class="t" x="380" y="394">查询规划 query_understanding_service</text>
  <text class="s" x="380" y="414">LLM 一次性规划：意图 / 子查询拆解 / 过滤条件 / top_k</text>
  <text class="s" x="380" y="430">（LLM 失败时回退到规则规划）</text>
  <line class="edge" x1="380" y1="440" x2="380" y2="468" marker-end="url(#arrow)"/>

  <!-- D1 表格分析命中? -->
  <polygon class="diamond" points="380,472 530,530 380,588 230,530"/>
  <text class="t" x="380" y="524">表格分析命中？</text>
  <text class="s" x="380" y="544">table_analysis_service</text>
  <text class="s" x="380" y="560">排名/趋势等确定性计算</text>
  <text class="lbl" x="588" y="520">是</text>
  <text class="lbl" x="396" y="610">否</text>

  <!-- S1 确定性答案 -->
  <rect class="side" x="680" y="498" width="320" height="64" rx="10"/>
  <text class="t" x="840" y="524">确定性答案</text>
  <text class="s" x="840" y="544">表格数据直接计算结果，跳过 LLM 生成</text>
  <polyline class="edge" points="530,530 676,530" marker-end="url(#arrow)"/>

  <!-- 确定性路径汇入 N9 -->
  <polyline class="edge" points="840,562 840,1020 584,1020" marker-end="url(#arrow)"/>
  <text class="note" x="852" y="800">确定性路径</text>

  <!-- N6 混合检索 -->
  <line class="edge" x1="380" y1="588" x2="380" y2="620" marker-end="url(#arrow)"/>
  <rect class="box" x="180" y="624" width="400" height="72" rx="10"/>
  <text class="t" x="380" y="650">混合检索 retrieval_service</text>
  <text class="s" x="380" y="670">多子查询并行 · 向量（embedding）+ 关键词打分</text>
  <text class="s" x="380" y="686">元数据过滤 / 每文档限额 / full_scan 保护</text>
  <line class="edge" x1="380" y1="696" x2="380" y2="724" marker-end="url(#arrow)"/>

  <!-- N7 sources -->
  <rect class="box" x="180" y="728" width="400" height="56" rx="10"/>
  <text class="t" x="380" y="752">知识来源 sources</text>
  <text class="s" x="380" y="772">SSE 事件：sources（先行推送给前端展示）</text>
  <line class="edge" x1="380" y1="784" x2="380" y2="828" marker-end="url(#arrow)"/>

  <!-- D2 Evidence Gate -->
  <polygon class="diamond" points="380,832 545,892 380,952 215,892"/>
  <text class="t" x="380" y="880">Evidence Gate</text>
  <text class="s" x="380" y="900">证据是否充分？</text>
  <text class="s" x="380" y="918">answer_quality_service</text>
  <text class="lbl" x="396" y="974">是</text>
  <text class="lbl" x="196" y="880">否</text>

  <!-- S2 兜底 -->
  <rect class="fallback" x="20" y="984" width="240" height="64" rx="10"/>
  <text class="t" x="140" y="1010">兜底回答</text>
  <text class="s" x="140" y="1030">no_source.md 模板 / 来源不足 fallback</text>
  <polyline class="edge" points="215,892 140,892 140,980" marker-end="url(#arrow)"/>

  <!-- N9 生成答案 -->
  <line class="edge" x1="380" y1="952" x2="380" y2="980" marker-end="url(#arrow)"/>
  <rect class="box" x="180" y="984" width="400" height="72" rx="10"/>
  <text class="t" x="380" y="1010">生成答案</text>
  <text class="s" x="380" y="1030">确定性结果 或 构建 Prompt（rag/answer.md + 上下文 + 来源）</text>
  <text class="s" x="380" y="1046">→ llm_service 生成</text>
  <line class="edge" x1="380" y1="1056" x2="380" y2="1084" marker-end="url(#arrow)"/>

  <!-- N10 校验 -->
  <rect class="box" x="180" y="1088" width="400" height="64" rx="10"/>
  <text class="t" x="380" y="1114">答案校验 verify_answer</text>
  <text class="s" x="380" y="1134">核对数字 / 实体 / 文件名，严重不符时替换为保守回答</text>
  <line class="edge" x1="380" y1="1152" x2="380" y2="1180" marker-end="url(#arrow)"/>

  <!-- N11 保存 -->
  <rect class="box" x="180" y="1184" width="400" height="64" rx="10"/>
  <text class="t" x="380" y="1210">保存 assistant 消息 + 质量报告</text>
  <text class="s" x="380" y="1230">json_store 持久化 · SSE 事件：delta → done</text>
  <line class="edge" x1="380" y1="1248" x2="380" y2="1276" marker-end="url(#arrow)"/>

  <!-- N12 前端渲染 -->
  <rect class="end" x="180" y="1280" width="400" height="56" rx="10"/>
  <text class="t" x="380" y="1304">前端渲染</text>
  <text class="s" x="380" y="1324">答案 + 来源列表 + 质量报告（evidence_gate / answer_verifier）</text>

  <!-- 兜底汇入保存 -->
  <polyline class="edge" points="140,1048 140,1216 176,1216" marker-end="url(#arrow)"/>

  <!-- 图例 -->
  <g>
    <rect x="330" y="1368" width="14" height="14" rx="3" fill="#eef2ff" stroke="#6366f1"/>
    <text class="note" x="350" y="1380">主流程</text>
    <rect x="420" y="1368" width="14" height="14" rx="3" fill="#fff7ed" stroke="#f59e0b"/>
    <text class="note" x="440" y="1380">判断</text>
    <rect x="490" y="1368" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#10b981"/>
    <text class="note" x="510" y="1380">确定性路径（不经 LLM）</text>
    <rect x="660" y="1368" width="14" height="14" rx="3" fill="#fef2f2" stroke="#ef4444"/>
    <text class="note" x="680" y="1380">兜底路径</text>
  </g>
</svg>
